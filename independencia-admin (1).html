<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel Admin · Independencia 1816</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700&family=Spectral:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0c1220; --panel:#141d31; --panel-2:#1b2740; --line:rgba(224,172,82,.16);
    --gold:#e0ac52; --gold-dim:#b8893f; --text:#e9e4d6; --text-dim:#9aa3b8;
    --good:#3f9d6f; --bad:#c85757; --wax:#8a2f2f;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh; background:
      radial-gradient(ellipse at 15% 0%, rgba(224,172,82,.08), transparent 45%),
      radial-gradient(ellipse at 85% 100%, rgba(63,157,111,.06), transparent 45%),
      var(--bg);
    font-family:'Spectral',serif; color:var(--text); padding:28px 16px 70px;
  }
  .wrap{max-width:880px; margin:0 auto;}
  header{display:flex; align-items:baseline; justify-content:space-between; flex-wrap:wrap; gap:10px; margin-bottom:24px; border-bottom:1px solid var(--line); padding-bottom:16px;}
  .eyebrow{font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.3em; text-transform:uppercase; color:var(--gold);}
  h1{font-family:'Cormorant Garamond',serif; font-weight:700; font-size:32px; margin:4px 0 0;}
  .phase-pill{
    font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.1em; text-transform:uppercase;
    background:var(--panel-2); border:1px solid var(--line); color:var(--gold); padding:7px 14px; border-radius:99px;
  }

  .grid{display:grid; grid-template-columns:1.3fr .9fr; gap:18px;}
  @media (max-width:760px){.grid{grid-template-columns:1fr;}}

  .panel{background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:22px; margin-bottom:18px;}
  .panel h2{font-family:'Cormorant Garamond',serif; font-weight:700; font-size:20px; margin:0 0 14px; color:var(--gold);}
  textarea{
    width:100%; min-height:110px; font-family:'Spectral',serif; font-size:15px; line-height:1.55;
    background:var(--panel-2); border:1px solid var(--line); border-radius:8px; color:var(--text);
    padding:12px 14px; resize:vertical; margin-bottom:14px;
  }
  textarea:focus{outline:none; border-color:var(--gold);}

  .btn{
    font-family:'JetBrains Mono',monospace; font-size:12.5px; letter-spacing:.12em; text-transform:uppercase;
    background:var(--gold); color:#1c1305; border:none; padding:13px 22px; border-radius:7px; cursor:pointer;
    transition:transform .15s ease, filter .15s ease; margin-right:10px; margin-bottom:8px;
  }
  .btn:hover{transform:translateY(-2px); filter:brightness(1.08);}
  .btn-danger{background:transparent; color:var(--bad); border:1px solid rgba(200,87,87,.4);}

  .stat-row{display:flex; gap:18px; flex-wrap:wrap; margin-bottom:6px;}
  .stat{font-family:'JetBrains Mono',monospace;}
  .stat .num{font-family:'Cormorant Garamond',serif; font-weight:700; font-size:30px; color:var(--gold); display:block;}
  .stat .lbl{font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--text-dim);}

  .participant{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:9px 0; border-bottom:1px solid var(--line); font-size:14px;
  }
  .participant:last-child{border-bottom:none;}
  .badge{font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:.08em; padding:3px 8px; border-radius:99px; background:rgba(63,157,111,.15); color:var(--good);}

  .q-preview{font-family:'Cormorant Garamond',serif; font-size:19px; font-weight:600; margin:0 0 10px; color:var(--text);}
  .opt-row{display:flex; align-items:center; justify-content:space-between; padding:8px 10px; background:var(--panel-2); border-radius:6px; margin-bottom:6px; font-size:13.5px;}
  .opt-row.correct{border:1px solid rgba(63,157,111,.4);}
  .opt-count{font-family:'JetBrains Mono',monospace; color:var(--gold);}

  .empty{color:var(--text-dim); font-size:13.5px; font-style:italic;}
  .link-note{font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--text-dim); letter-spacing:.05em; margin-top:4px;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="eyebrow">Panel privado · No compartir este enlace</div>
      <h1>Control — Independencia 1816</h1>
    </div>
    <div class="phase-pill" id="phase-pill">CARGANDO…</div>
  </header>

  <div class="grid">
    <div>
      <div class="panel" id="control-panel"></div>
      <div class="panel" id="question-panel" style="display:none;"></div>
    </div>
    <div class="panel" id="participants-panel"></div>
  </div>
</div>

<!-- ============ FIREBASE ============ -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
/* =====================================================================
   PEGÁ ACÁ TU CONFIGURACIÓN DE FIREBASE (la misma que en la página del quiz)
   ===================================================================== */
const firebaseConfig = {
  apiKey: "AIzaSyBJ5QyiT9RyxKq2wtxP-WUnSo0US8bR7To",
  authDomain: "independencia-1816.firebaseapp.com",
  databaseURL: "https://independencia-1816-default-rtdb.firebaseio.com",
  projectId: "independencia-1816",
  storageBucket: "independencia-1816.firebasestorage.app",
  messagingSenderId: "158213747062",
  appId: "1:158213747062:web:3274f98cb5729530b68a57",
  measurementId: "G-Q2HF22J31D"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
</script>

<script>
const ROUND1 = [
{q:"¿Qué territorio existía antes de 1810 en la región que hoy es Argentina?",opts:[
  {t:"La República Argentina",c:false},{t:"El Virreinato del Río de la Plata",c:true},
  {t:"La Confederación del Plata",c:false},{t:"El Reino de Buenos Aires",c:false}]},
{q:"¿Qué demostraron las invasiones inglesas de 1806 y 1807?",opts:[
  {t:"Que España enviaría siempre tropas a tiempo",c:false},
  {t:"Que los habitantes de Buenos Aires podían organizarse militarmente por sus propios medios",c:true},
  {t:"Que Inglaterra dominaría el Río de la Plata",c:false},{t:"Que Fernando VII apoyaba a los criollos",c:false}]},
{q:"¿Qué ocurrió en España en 1808 y por qué fue clave?",opts:[
  {t:"Fernando VII declaró la independencia americana",c:false},
  {t:"Napoleón intervino y Fernando VII quedó cautivo, generando una crisis de autoridad",c:true},
  {t:"España le vendió el virreinato a Francia",c:false},{t:"Se abolió la monarquía española",c:false}]},
{q:"¿Qué se discutió en el Cabildo Abierto del 22 de mayo de 1810?",opts:[
  {t:"La redacción del Himno Nacional",c:false},{t:"Si el virrey Cisneros debía continuar gobernando",c:true},
  {t:"La abolición de la esclavitud",c:false},{t:"El nombre del nuevo país",c:false}]},
{q:"¿Quién presidió la Primera Junta, formada el 25 de mayo de 1810?",opts:[
  {t:"Mariano Moreno",c:false},{t:"Manuel Belgrano",c:false},{t:"Cornelio Saavedra",c:true},{t:"Juan José Paso",c:false}]},
{q:"¿La Revolución de Mayo declaró formalmente la independencia?",opts:[
  {t:"Sí, el 25 de mayo de 1810 se declaró la independencia",c:false},
  {t:"No, en 1810 comenzó un proceso de autogobierno que culminó recién en 1816",c:true},
  {t:"Sí, pero solo de forma provisional durante un año",c:false},{t:"No, la independencia se declaró en 1806",c:false}]},
{q:"¿Qué fue la Asamblea del Año XIII (1813)?",opts:[
  {t:"El Congreso que declaró la independencia",c:false},
  {t:"Una asamblea que avanzó medidas de gobierno pero no declaró la independencia",c:true},
  {t:"El tratado de paz con España",c:false},{t:"La primera Constitución argentina",c:false}]},
{q:"¿Cuál fue la estrategia continental de José de San Martín?",opts:[
  {t:"Avanzar directamente por el Alto Perú",c:false},
  {t:"Cruzar los Andes desde Mendoza, liberar Chile y atacar Perú por mar",c:true},
  {t:"Pedir ayuda militar a Inglaterra",c:false},{t:"Negociar la paz directamente con Fernando VII",c:false}]}
];
const ROUND2 = [
{q:"¿Quién comandó las victorias de Tucumán (1812) y Salta (1813)?",opts:[
  {t:"José de San Martín",c:false},{t:"Martín Miguel de Güemes",c:false},{t:"Manuel Belgrano",c:true},{t:"Cornelio Saavedra",c:false}]},
{q:"¿Qué derrota de 1815 dejó al Alto Perú bajo control realista?",opts:[
  {t:"Vilcapugio",c:false},{t:"Ayohuma",c:false},{t:"Sipe-Sipe",c:true},{t:"Salta",c:false}]},
{q:"¿Qué papel cumplió Martín Miguel de Güemes?",opts:[
  {t:"Presidió el Congreso de Tucumán",c:false},
  {t:"Defendió la frontera norte con sus gauchos frente a los realistas",c:true},
  {t:"Cruzó los Andes junto a San Martín",c:false},{t:"Redactó el Acta de Independencia",c:false}]},
{q:"¿Participaron todas las provincias actuales de Argentina en el Congreso de Tucumán?",opts:[
  {t:"Sí, todas sin excepción",c:false},
  {t:"No: las provincias de la Liga de los Pueblos Libres no participaron",c:true},
  {t:"No participó ninguna provincia del interior",c:false},{t:"Solo participó Buenos Aires",c:false}]},
{q:"¿Quién presidía el Congreso el día de la declaración de independencia?",opts:[
  {t:"Juan Martín de Pueyrredón",c:false},{t:"Manuel Belgrano",c:false},{t:"Narciso Laprida",c:true},{t:"Juan José Paso",c:false}]},
{q:"¿Qué propuso Manuel Belgrano ante el Congreso, aunque no era diputado?",opts:[
  {t:"Una monarquía constitucional con un descendiente de los incas",c:true},
  {t:"La abolición inmediata de la esclavitud",c:false},
  {t:"Una alianza militar con Estados Unidos",c:false},{t:"El traslado inmediato del Congreso a Buenos Aires",c:false}]},
{q:"¿Cómo se llamó oficialmente la nación declarada independiente en 1816?",opts:[
  {t:"República Argentina",c:false},{t:"Provincias Unidas en Sud-América",c:true},
  {t:"Confederación Argentina",c:false},{t:"Virreinato Independiente del Plata",c:false}]},
{q:"¿Qué frase se agregó al acta días después de la declaración original?",opts:[
  {t:"'y de toda otra dominación extranjera'",c:true},{t:"'bajo la protección de Inglaterra'",c:false},
  {t:"'con capital en Tucumán'",c:false},{t:"'en unión con Chile y Perú'",c:false}]}
];

const DEFAULT_INTRO_1 = "Antes de 1810, el territorio que hoy es Argentina formaba parte del Virreinato del Río de la Plata, gobernado en nombre del rey de España. Las invasiones inglesas de 1806 y 1807 mostraron que los criollos podían defenderse solos, y la crisis de la monarquía española en 1808 abrió la puerta a la Revolución de Mayo de 1810: el inicio de un largo proceso de autogobierno que recién culminaría en 1816.";
const DEFAULT_INTRO_2 = "Entre 1810 y 1816 hubo guerra y discusión política en simultáneo. Belgrano venció en Tucumán y Salta, pero la derrota de Sipe-Sipe en 1815 dejó al Alto Perú en manos realistas. Güemes defendió el norte, San Martín preparó su plan continental, y en 1816, con Fernando VII de vuelta en el trono, el Congreso reunido en Tucumán declaró finalmente la independencia el 9 de julio.";

let state = {phase:'lobby', round:1, qIndex:0, introText: DEFAULT_INTRO_1};
let participants = {};

function setState(newState){
  state = newState;
  db.ref('quizstate').set(state);
}

function phaseLabel(p){
  return {
    'lobby':'ESPERANDO INICIO', 'r1-intro':'RONDA 1 · INTRO', 'r1-q':'RONDA 1 · PREGUNTAS',
    'r1-done':'RONDA 1 · FINALIZADA', 'r2-intro':'RONDA 2 · INTRO', 'r2-q':'RONDA 2 · PREGUNTAS',
    'finished':'QUIZ FINALIZADO'
  }[p] || p;
}

function renderControlPanel(){
  const el = document.getElementById('control-panel');
  const total = Object.keys(participants).length;

  if(state.phase === 'lobby'){
    el.innerHTML = `
      <h2>Ronda 1 — Introducción</h2>
      <label style="font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-dim);display:block;margin-bottom:8px;">Texto que verán los participantes antes de empezar</label>
      <textarea id="intro-text">${state.introText}</textarea>
      <button class="btn" id="start-r1">Iniciar Quiz</button>
      <p class="link-note">${total} participante(s) conectado(s) esperando.</p>
    `;
    document.getElementById('start-r1').addEventListener('click', ()=>{
      const txt = document.getElementById('intro-text').value.trim() || DEFAULT_INTRO_1;
      setState({phase:'r1-intro', round:1, qIndex:0, introText:txt});
    });
  } else if(state.phase === 'r1-intro'){
    el.innerHTML = `
      <h2>Ronda 1 — Introducción activa</h2>
      <p style="color:var(--text-dim); font-size:14px; line-height:1.6;">${state.introText}</p>
      <button class="btn" id="start-q1">Iniciar Pregunta 1</button>
    `;
    document.getElementById('start-q1').addEventListener('click', ()=>{
      setState(Object.assign({}, state, {phase:'r1-q', qIndex:0}));
    });
  } else if(state.phase === 'r1-q'){
    renderQuestionControl(1);
  } else if(state.phase === 'r1-done'){
    el.innerHTML = `
      <h2>Ronda 2 — Introducción</h2>
      <label style="font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-dim);display:block;margin-bottom:8px;">Texto que verán los participantes antes de la ronda 2</label>
      <textarea id="intro-text-2">${DEFAULT_INTRO_2}</textarea>
      <button class="btn" id="start-r2">Iniciar Ronda 2</button>
    `;
    document.getElementById('start-r2').addEventListener('click', ()=>{
      const txt = document.getElementById('intro-text-2').value.trim() || DEFAULT_INTRO_2;
      setState({phase:'r2-intro', round:2, qIndex:0, introText:txt});
    });
  } else if(state.phase === 'r2-intro'){
    el.innerHTML = `
      <h2>Ronda 2 — Introducción activa</h2>
      <p style="color:var(--text-dim); font-size:14px; line-height:1.6;">${state.introText}</p>
      <button class="btn" id="start-q1r2">Iniciar Pregunta 1</button>
    `;
    document.getElementById('start-q1r2').addEventListener('click', ()=>{
      setState(Object.assign({}, state, {phase:'r2-q', qIndex:0}));
    });
  } else if(state.phase === 'r2-q'){
    renderQuestionControl(2);
  } else if(state.phase === 'finished'){
    el.innerHTML = `
      <h2>Quiz finalizado</h2>
      <p style="color:var(--text-dim); font-size:14px;">Todos los participantes ya pueden ver su resultado final.</p>
      <button class="btn btn-danger" id="reset-btn">Reiniciar todo</button>
    `;
    document.getElementById('reset-btn').addEventListener('click', ()=>{
      if(!confirm('Esto borra participantes y respuestas. ¿Continuar?')) return;
      db.ref('users').remove();
      participants = {};
      setState({phase:'lobby', round:1, qIndex:0, introText:DEFAULT_INTRO_1});
    });
  }
}

function renderQuestionControl(round){
  const el = document.getElementById('control-panel');
  const list = round === 1 ? ROUND1 : ROUND2;
  const isLast = state.qIndex === list.length - 1;
  el.innerHTML = `
    <h2>Ronda ${round} — Pregunta ${state.qIndex+1} de ${list.length}</h2>
    <div class="stat-row">
      <div class="stat"><span class="num" id="answered-count">0</span><span class="lbl">Respondieron</span></div>
      <div class="stat"><span class="num">${Object.keys(participants).length}</span><span class="lbl">Conectados</span></div>
    </div>
    <button class="btn" id="next-q">${isLast ? (round===1?'Finalizar Ronda 1':'Finalizar Quiz') : 'Siguiente pregunta'}</button>
  `;
  document.getElementById('next-q').addEventListener('click', ()=>{
    if(isLast){
      if(round === 1) setState(Object.assign({}, state, {phase:'r1-done'}));
      else setState(Object.assign({}, state, {phase:'finished'}));
    } else {
      setState(Object.assign({}, state, {qIndex: state.qIndex + 1}));
    }
  });
  renderQuestionPreview(round, state.qIndex);
}

function renderQuestionPreview(round, qIndex){
  const panel = document.getElementById('question-panel');
  panel.style.display = 'block';
  const list = round === 1 ? ROUND1 : ROUND2;
  const item = list[qIndex];
  let answeredCount = 0;
  const counts = item.opts.map(()=>0);

  Object.values(participants).forEach(p=>{
    const arr = round === 1 ? p.r1 : p.r2;
    const a = arr && arr.find(x=>x.qIndex===qIndex);
    if(a){
      answeredCount++;
      const optIdx = item.opts.findIndex(o=>o.t === a.sel);
      if(optIdx >= 0) counts[optIdx]++;
    }
  });
  const cEl = document.getElementById('answered-count');
  if(cEl) cEl.textContent = answeredCount;

  let rows = '';
  item.opts.forEach((o,i)=>{
    rows += '<div class="opt-row '+(o.c?'correct':'')+'"><span>'+o.t+'</span><span class="opt-count">'+counts[i]+'</span></div>';
  });
  panel.innerHTML = '<h2>Vista previa — respuestas en vivo</h2><p class="q-preview">'+item.q+'</p>'+rows;
}

function renderParticipants(){
  const el = document.getElementById('participants-panel');
  const ids = Object.keys(participants);
  let rows = '';
  if(ids.length === 0){
    rows = '<p class="empty">Nadie se unió todavía. Compartí el enlace del quiz.</p>';
  } else {
    ids.forEach(id=>{
      const p = participants[id];
      let doneR1 = (p.r1||[]).length, doneR2 = (p.r2||[]).length;
      let statusTxt = 'R1: '+doneR1+'/8 · R2: '+doneR2+'/8';
      rows += '<div class="participant"><span>'+(p.device || 'Dispositivo desconocido')+'</span><span class="badge">'+statusTxt+'</span></div>';
    });
  }
  el.innerHTML = '<h2>Participantes ('+ids.length+')</h2>'+rows;
}

function render(){
  document.getElementById('phase-pill').textContent = phaseLabel(state.phase);
  if(state.phase !== 'r1-q' && state.phase !== 'r2-q'){
    document.getElementById('question-panel').style.display = 'none';
  }
  renderControlPanel();
  renderParticipants();
}

/* ===================== REALTIME LISTENERS ===================== */
db.ref('quizstate').on('value', (snap)=>{
  const val = snap.val();
  if(val){ state = val; } else { db.ref('quizstate').set(state); }
  render();
});

db.ref('users').on('value', (snap)=>{
  participants = snap.val() || {};
  render();
});
</script>
</body>
</html>
